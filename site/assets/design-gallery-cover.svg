<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Design Gallery cover</title>
  <desc id="desc">A blush, peach, and lavender gallery cover with five placeholder category tiles for Logo Design, Mascot Design, Brand Identity, Illustration, and Print Design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3f8"/><stop offset="0.5" stop-color="#fff6ec"/><stop offset="1" stop-color="#f1ebff"/></linearGradient>
