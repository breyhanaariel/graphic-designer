<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Graphic Designer portfolio cover</title>
  <desc id="desc">A feminine blush, peach, and lavender portfolio cover featuring Peach and Petal, RibbonHQ, and Cherry Static.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2f7"/>
      <stop offset="0.5" stop-color="#fff4ea"/>
      <stop offset="1" stop-color="#f2ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#72495d" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1400" height="700" rx="44" fill="url(#bg)"/>
  <circle cx="1235" cy="95" r="150" fill="#eadcff" opacity="0.75"/>
  <circle cx="120" cy="615" r="170" fill="#ffd9c7" opacity="0.65"/>
  <text x="92" y="116" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9b6680" letter-spacing="5">GRAPHIC DESIGNER PORTFOLIO</text>
  <text x="92" y="210" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#4d3b47">Brianna Dickenson 🎀</text>
  <text x="92" y="264" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#75636e">Brand Identity · Campaign Design · Visual Communication · Illustration</text>
  <g filter="url(#shadow)">
    <rect x="92" y="342" width="360" height="225" rx="30" fill="#fff8f2" stroke="#efd9cc"/>
    <text x="126" y="404" font-family="Arial, Helvetica, sans-serif" font-size="42">🍑</text>
    <text x="126" y="458" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#4d3b47">Peach &amp; Petal</text>
    <text x="126" y="500" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#776771">Consumer brand identity</text>
    <text x="126" y="533" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a66a7f">Packaging · illustration · launch</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="318" width="360" height="249" rx="30" fill="#fbf8ff" stroke="#e6d9f1"/>
    <text x="554" y="383" font-family="Arial, Helvetica, sans-serif" font-size="42">🎀</text>
    <text x="554" y="437" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#4d3b47">RibbonHQ</text>
    <text x="554" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#776771">B2B visual communication</text>
    <text x="554" y="514" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8c70aa">Editorial · decks · launch systems</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="930" y="338" width="392" height="229" rx="30" fill="#3b1626" stroke="#6c3148"/>
    <text x="964" y="402" font-family="Arial, Helvetica, sans-serif" font-size="42">🍒</text>
    <text x="964" y="456" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#fff7fb">Cherry Static</text>
    <text x="964" y="497" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#f2dfe8">Integrated campaign design</text>
    <text x="964" y="531" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffabc7">Social · posters · motion</text>
  </g>
  <text x="1280" y="635" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#c07b9b">✦ ♡ ✿</text>
